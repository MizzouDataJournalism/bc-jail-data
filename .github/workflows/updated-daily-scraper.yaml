name: Daily Boone County Jail data scraper

on: 
    schedule:
        - cron: '19 16 * * *'   # aiming for 4:19 pm UTC or 10:19 am CST
    workflow_dispatch:

jobs: 
    run-script:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        timeout-minutes: 15

        steps:
            - name: Check out repo
              uses: actions/checkout@v4

            - name: Set up R
              uses: r-lib/actions/setup-r@v2
              with:
                r-version: '4.4.1'
                use-public-rspm: true
            
            - name: Install R package dependencies
              uses: r-lib/actions/setup-r-dependencies@v2
              with:
                packages: |
                    any::tidyverse
                    any::httr2
                    any::readxl
                    any::writexl
                    any::janitor

            - name: Run script
              run: Rscript master-script-bc-jail.R

            - name: Commit updated data
              run: |
                git config --local user.name "github-actions[bot]"
                git config --local user.email "github-actions[bot]@users.noreply.github.com"
                git add updated-data/raw-files/
                git add updated-data/past_7_am_reports.xlsx
                git add updated-data/past_current_detainees.xlsx
                git commit -m "Daily data update $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
                git push